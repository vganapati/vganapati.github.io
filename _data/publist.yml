- title: "Optimal physical preprocessing for example-based super-resolution"
  image: LED_array_microscope.png
  description: Computational imaging concerns the joint design of physical hardware with image post-processing algorithms. The data recorded by the image sensor may be garbled, but as long as it contains the necessary information, the final image can be reconstructed with image post-processing. The advantages of computational imaging are reduced hardware costs and the possible recovery of quantities difficult to image directly, such as depth and the phase of light. We optimize the end-to-end computational imaging pipeline with deep learning, in order to surpass existing imaging tradeoffs among speed, resolution, and field-of-view.
  authors: Alexander Robey, Vidya Ganapati
  link:
    url: https://doi.org/10.1364/OE.26.031333
