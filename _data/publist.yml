- title: "Light Trapping Textures Designed by Electromagnetic Optimization for Subwavelength Thick Solar Cells"
  image: ieee_jpv_light_trapping.jpg
  description: Solar cells are routinely textured in order to increase light absorption and efficiency. The benefits of texturing are generally evaluated using ray optics approximations. These approximations fail when the solar cell thickness is on the order of the wavelength of light. We use inverse design and shape calculus to optimize surface textures for subwavelength-thick solar cells. We show that with optimized designs we can approach ray-optics limits for these thin cells.
  authors: Vidya Ganapati, Owen D. Miller, Eli Yablonovitch
  link:
