- title: "HYPPO: A Surrogate-Based Multi-Level Parallelism Tool for Hyperparameter Optimization"
  image: hyppo.jpg
  description: What are the best hyperparameters (e.g. batch size, training rate, network depth) for a neural network? We would like to optimize these hyperparameters, but obtaining the derivatives for a gradient-based search is difficult. Thus, we estimate surrogate models of the underlying function relating the hyperparameters to figure of merit. Using forward function calls, we improve this surrogate function until our compute budget runs out. We validate HYPPO for different use cases, including sparse x-ray computed tomography.
  authors: Vincent Dumont, Casey Garner, Anuradha Trivedi, Chelsea Jones, Vidya Ganapati, Juliane Mueller, Talita Perciano, Mariam Kiran, Marc Day
  link:
