- title: "Evaluating Research Grade Bioimpedance Hardware using Textile Electrodes for Long-term Fluid Status Monitoring"
  image: sock.png
  description: Human calf bioimpedance can be a useful for diagnostics and monitoring in conditions such as congestive heart failure. We prototype a fabric sock to mimic a printed circuit board and electronically connect to the calf; the sock consists of layers of conductive and insulating fabric connected by metallic snaps that act as vias.
  authors: Maggie Delano, Vidya Ganapati, Rezhwan Kamal, Bryan Le, Jackie Le, Rey Mendoza
  link:
    url: https://doi.org/10.3389/felec.2021.762442
    display: Frontiers in Electronics (2022)