- title: "Ultraefficient thermophotovoltaic power conversion by band-edge spectral filtering"
  image: pnas1903001116.jpg
  description: Thermophotovoltaics (TPV) convert radiative heat to electricity with photovoltaics cells. This is a generalization of solar photovoltaics, which convert the radiation of the sun to electricity. TPV has the potential for high-efficiency electrical power generation from the combustion of fuel. TPV can also be used for converting waste heat or stored thermal energy to electricity. We achieved a record 28.8% efficiency of heat to electricity conversion by using photovoltaic cells with high back reflectivity.
  authors: Zunaid Omair, Gregg Scranton, Luis M. Pazos-Outón, T. Patrick Xiao, Myles A. Steiner, Vidya Ganapati, Per F. Peterson, John Holzrichter, Harry Atwater, Eli Yablonovitch
